# Блок для nginx: раздел парсера по подпути parsercompressor.online/parsercompany
#
# Вставьте этот location ВНУТРЬ существующего server { ... } сайта
# parsercompressor.online (того, что слушает 443 / ssl), затем:
#   sudo nginx -t && sudo systemctl reload nginx

location /parsercompany/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /parsercompany;  # ProxyFix строит ссылки с учётом префикса
    proxy_read_timeout 600s;   # парсинг может идти долго
}

# Редирект без завершающего слэша: /parsercompany -> /parsercompany/
location = /parsercompany {
    return 301 /parsercompany/;
}
